name: Version Release

# Publishes the release for the version in the VERSION file. Release notes
# are written as a GitHub draft release named vX.Y.Z (Releases → Draft a new
# release). When VERSION changes on main, or when this is started by hand,
# for VERSION=X.Y.Z it:
#   1. does nothing if vX.Y.Z is already published, so re-runs are safe;
#   2. tags the current commit vX.Y.Z, or reuses that tag if an earlier,
#      interrupted run created it on this same commit;
#   3. publishes the vX.Y.Z draft on that tag. GitHub's generated "What's
#      Changed" list (grouped by .github/release.yml) is appended unless the
#      draft already has one. Without a draft, the release gets only that list;
#   4. starts the Docker build for the tag. A tag pushed with GITHUB_TOKEN does
#      not trigger other workflows, so the build has to be dispatched.

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:

concurrency:
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write   # push the tag and publish the release
  actions: write    # dispatch the Docker build for the tag

jobs:
  release:
    if: ${{ github.repository_owner == 'AOSSIE-Org' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version detected: $VERSION"

      - name: Validate VERSION format
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION must follow semantic versioning (e.g., 1.0.0)"
            exit 1
          fi
          echo "✓ Version format is valid: $VERSION"

      - name: Check whether this version is already released
        id: existing
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "::notice::$TAG is already released; nothing to do."
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.existing.outputs.released == 'false'
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG already exists on another commit ($(git rev-parse --short "$TAG^{commit}")). Bump VERSION, or delete the tag if it was created by mistake."
              exit 1
            fi
            echo "✓ Reusing existing tag $TAG on this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release version ${{ steps.get_version.outputs.version }}"
            git push origin "$TAG"
            echo "✓ Created and pushed tag $TAG"
          fi

      - name: Publish the draft release
        if: steps.existing.outputs.released == 'false'
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          NOTES="$RUNNER_TEMP/release-notes.md"

          # The previous published release, if any, bounds the generated list.
          PREVIOUS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // empty')
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" ${PREVIOUS:+-f previous_tag_name="$PREVIOUS"} \
            --jq '.body' > "$RUNNER_TEMP/generated.md"

          # The draft written for this version, by name or by tag.
          DRAFT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and (.name == \"$TAG\" or .tag_name == \"$TAG\")) | .id" | head -n 1)

          if [ -n "$DRAFT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --jq '.body // ""' > "$NOTES"
            if ! grep -q "^## What's Changed" "$NOTES"; then
              printf '\n' >> "$NOTES"
              cat "$RUNNER_TEMP/generated.md" >> "$NOTES"
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              -f tag_name="$TAG" -f name="$TAG" -F draft=false -f make_latest=true \
              -F body=@"$NOTES" > /dev/null
            echo "✓ Published draft release $TAG"
          else
            echo "::warning::No draft release named $TAG found; publishing with the generated list only."
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/generated.md" --latest
            echo "✓ Created release $TAG"
          fi

      - name: Build and publish the Docker image for the tag
        if: steps.existing.outputs.released == 'false'
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          gh workflow run docker-publish.yml --ref "$TAG"
          echo "✓ Dispatched docker-publish.yml for $TAG"

      - name: Release Summary
        if: always()
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $TAG" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.existing.outputs.released }}" = "true" ]; then
            echo "- Already released, nothing to do." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" = "success" ]; then
            echo "- **GitHub release:** https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
            echo "- **Docker image:** building as ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v} (see the Docker Publish workflow)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release failed.** Check the steps above; re-running is safe." >> $GITHUB_STEP_SUMMARY
          fi
