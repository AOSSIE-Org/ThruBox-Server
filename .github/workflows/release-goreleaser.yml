name: Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
# Manual only. .goreleaser.yaml is still the unconfigured template, and
# releases currently ship as Docker images (see version-release.yml). Once
# binary builds are configured, trigger this from version-release.yml the
# same way docker-publish.yml is.
on:
  workflow_dispatch:
jobs:
  release:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write          # [DOCKER] Required for ghcr.io push
      id-token: write          # [SIGNING] Required for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0   # Full history needed for changelog
          persist-credentials: false  # Avoid exposing token to submodules
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}     # [NODE]
          # DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}  # [DOCKER]