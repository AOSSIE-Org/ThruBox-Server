# Categories for GitHub's generated release notes ("What's Changed").
# version-release.yml appends this list to docs/releases/vX.Y.Z.md.
# A pull request goes in the first category whose labels it matches.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - no-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: 🔐 Security
      labels:
        - security
    - title: 🚀 Features
      labels:
        - feature
        - feat
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bugfix
        - bug
    - title: ⚙️ Backend
      labels:
        - backend
        - api
    - title: 🐳 Docker
      labels:
        - docker
    - title: ⬆️ Dependencies
      labels:
        - dependencies
        - deps
    - title: 🚀 CI/CD
      labels:
        - ci-cd
        - github-actions
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
    - title: 🧰 Maintenance
      labels:
        - chore
        - maintenance
        - refactor
        - configuration
        - config
        - tests
        - test
    - title: Other Changes
      labels:
        - "*"
